name: Build YN038 Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - yn038-xiaozhi
          - yn038-xiaozhi-tft
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          python scripts/build.py yn038-xiaozhi --name "${{ matrix.variant }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
